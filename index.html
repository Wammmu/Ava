<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b1020" />
  <meta name="description" content="아바르타라 세계관 아카이브 — 만다라바르샤, 삼주룡, 십방위룡" />
  <title>아바르타라 세계관 아카이브</title>

  <style>
    :root{
      --bg:#070a12;
      --bg2:#0d1220;
      --panel:rgba(16,22,38,.72);
      --panel-strong:rgba(18,25,43,.92);
      --line:rgba(255,255,255,.11);
      --text:#edf2ff;
      --muted:#aab5cc;
      --accent:#d7b86a;
      --accent2:#7aa7ff;
      --shadow:0 18px 60px rgba(0,0,0,.35);
      --radius:24px;
      --radius-sm:16px;
      --max:1220px;
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      color:var(--text);
      background:
        radial-gradient(circle at 15% 15%, rgba(95,120,220,.16), transparent 30%),
        radial-gradient(circle at 85% 20%, rgba(220,174,90,.12), transparent 28%),
        radial-gradient(circle at 50% 85%, rgba(72,150,135,.10), transparent 32%),
        linear-gradient(180deg, #070a12 0%, #0b1020 55%, #070a12 100%);
      font-family:
        Pretendard, "Noto Sans KR", "Apple SD Gothic Neo",
        "Malgun Gothic", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      min-height:100vh;
      overflow-x:hidden;
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      z-index:-2;
      opacity:.14;
      background-image:
        linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
      background-size:42px 42px;
      mask-image:linear-gradient(to bottom, rgba(0,0,0,.8), transparent 86%);
      pointer-events:none;
    }

    body::after{
      content:"";
      position:fixed;
      inset:-20%;
      z-index:-3;
      background:url("./assets/ui/background.webp") center/cover no-repeat;
      opacity:.08;
      filter:saturate(.7) contrast(1.1);
      pointer-events:none;
    }

    a{color:inherit}
    button{font:inherit}
    img{max-width:100%; display:block}

    .site-header{
      position:sticky;
      top:0;
      z-index:50;
      backdrop-filter:blur(18px);
      background:rgba(7,10,18,.74);
      border-bottom:1px solid var(--line);
    }

    .header-inner{
      max-width:var(--max);
      margin:auto;
      min-height:72px;
      padding:12px 22px;
      display:flex;
      align-items:center;
      gap:18px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:max-content;
      cursor:pointer;
      user-select:none;
    }

    .brand-mark{
      width:38px;
      height:38px;
      border:1px solid rgba(215,184,106,.6);
      border-radius:50%;
      display:grid;
      place-items:center;
      color:var(--accent);
      background:
        radial-gradient(circle, rgba(215,184,106,.17), transparent 62%);
      box-shadow:inset 0 0 30px rgba(215,184,106,.08);
    }

    .brand-mark::before{
      content:"✦";
      font-size:18px;
    }

    .brand-text strong{
      display:block;
      letter-spacing:.08em;
      font-size:.96rem;
    }

    .brand-text small{
      display:block;
      color:var(--muted);
      font-size:.72rem;
      margin-top:2px;
    }

    .top-nav{
      margin-left:auto;
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    .nav-btn{
      border:1px solid transparent;
      color:var(--muted);
      background:transparent;
      padding:9px 13px;
      border-radius:999px;
      cursor:pointer;
      transition:.18s ease;
    }

    .nav-btn:hover{
      color:var(--text);
      background:rgba(255,255,255,.055);
    }

    .nav-btn[aria-selected="true"]{
      color:#fff6d9;
      border-color:rgba(215,184,106,.38);
      background:rgba(215,184,106,.12);
    }

    main{
      max-width:var(--max);
      margin:0 auto;
      padding:34px 22px 70px;
    }

    .page{display:none; animation:fade .22s ease}
    .page.is-active{display:block}

    @keyframes fade{
      from{opacity:0; transform:translateY(5px)}
      to{opacity:1; transform:none}
    }

    .hero{
      position:relative;
      min-height:280px;
      border:1px solid var(--line);
      border-radius:32px;
      overflow:hidden;
      padding:42px;
      display:flex;
      flex-direction:column;
      justify-content:flex-end;
      background:
        linear-gradient(120deg, rgba(7,10,18,.94), rgba(8,14,29,.67)),
        var(--hero-image, none);
      background-position:center;
      background-size:cover;
      box-shadow:var(--shadow);
    }

    .hero::after{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      background:
        radial-gradient(circle at 78% 26%, rgba(215,184,106,.12), transparent 25%),
        linear-gradient(to top, rgba(7,10,18,.55), transparent 50%);
    }

    .hero > *{position:relative; z-index:1}

    .eyebrow{
      display:inline-flex;
      align-items:center;
      gap:8px;
      color:#e4c981;
      text-transform:uppercase;
      letter-spacing:.16em;
      font-size:.74rem;
      font-weight:700;
      margin-bottom:10px;
    }

    .hero h1{
      margin:0;
      font-size:clamp(2rem, 6vw, 4.9rem);
      line-height:1;
      letter-spacing:-.045em;
      max-width:850px;
    }

    .hero p{
      color:#c6d0e5;
      max-width:760px;
      font-size:1.02rem;
      line-height:1.75;
      margin:18px 0 0;
    }

    .section{
      margin-top:34px;
    }

    .section-head{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:18px;
      margin-bottom:16px;
    }

    .section-head h2{
      margin:0;
      font-size:clamp(1.35rem, 3vw, 2rem);
    }

    .section-head p{
      margin:7px 0 0;
      color:var(--muted);
      line-height:1.65;
      max-width:760px;
    }

    .pill{
      display:inline-flex;
      align-items:center;
      padding:7px 10px;
      border:1px solid var(--line);
      border-radius:999px;
      color:var(--muted);
      background:rgba(255,255,255,.035);
      font-size:.78rem;
      white-space:nowrap;
    }

    .world-grid{
      display:grid;
      grid-template-columns:1.05fr .95fr;
      gap:18px;
    }

    .glass{
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      backdrop-filter:blur(12px);
    }

    .lore-panel{padding:24px}

    .lore-panel h3{
      margin:0 0 10px;
      font-size:1.2rem;
    }

    .lore-panel p{
      margin:0;
      color:#c7d0e3;
      line-height:1.8;
    }

    .mandala-map{
      min-height:430px;
      position:relative;
      overflow:hidden;
      border-radius:var(--radius);
      background:
        radial-gradient(circle at center, rgba(215,184,106,.11), transparent 18%),
        radial-gradient(circle at center, transparent 0 31%, rgba(255,255,255,.07) 31.5% 32%, transparent 32.5%),
        radial-gradient(circle at center, transparent 0 45%, rgba(255,255,255,.045) 45.5% 46%, transparent 46.5%),
        linear-gradient(145deg, rgba(20,29,49,.86), rgba(8,12,22,.88));
      border:1px solid var(--line);
    }

    .map-node{
      position:absolute;
      transform:translate(-50%,-50%);
      border:1px solid rgba(255,255,255,.14);
      background:rgba(9,14,25,.86);
      color:#dfe6f6;
      border-radius:999px;
      padding:8px 10px;
      font-size:.76rem;
      cursor:pointer;
      white-space:nowrap;
      transition:.18s ease;
      box-shadow:0 8px 24px rgba(0,0,0,.28);
    }

    .map-node:hover{
      border-color:rgba(215,184,106,.55);
      color:#fff6d9;
      transform:translate(-50%,-50%) scale(1.04);
    }

    .map-node.core{
      padding:14px 16px;
      font-weight:800;
      color:#fff1c6;
      border-color:rgba(215,184,106,.5);
      background:rgba(43,35,18,.8);
    }

    .map-zenith,.map-nadir{
      position:absolute;
      left:50%;
      transform:translateX(-50%);
      font-size:.72rem;
      color:var(--muted);
      letter-spacing:.16em;
      text-transform:uppercase;
    }
    .map-zenith{top:12px}
    .map-nadir{bottom:12px}

    .region-grid{
      display:grid;
      grid-template-columns:repeat(2, minmax(0,1fr));
      gap:14px;
    }

    details.region,
    details.character-details{
      overflow:hidden;
    }

    details.region{
      background:rgba(255,255,255,.035);
      border:1px solid var(--line);
      border-radius:18px;
    }

    details.region[open]{
      background:rgba(255,255,255,.052);
    }

    details.region summary,
    details.character-details summary{
      list-style:none;
      cursor:pointer;
    }

    details.region summary::-webkit-details-marker,
    details.character-details summary::-webkit-details-marker{display:none}

    .region-summary{
      padding:17px 18px;
      display:flex;
      justify-content:space-between;
      gap:18px;
      align-items:center;
    }

    .region-summary strong{
      display:block;
      font-size:1rem;
    }

    .region-summary small{
      display:block;
      color:var(--muted);
      margin-top:4px;
    }

    .chev{
      width:28px;
      height:28px;
      flex:none;
      border-radius:50%;
      border:1px solid var(--line);
      display:grid;
      place-items:center;
      color:var(--muted);
      transition:transform .2s ease;
    }

    details[open] .chev{transform:rotate(45deg)}

    .region-body{
      border-top:1px solid var(--line);
      padding:16px 18px 19px;
      color:#c7d0e3;
      line-height:1.75;
    }

    .region-body p{margin:0 0 12px}

    .place-list{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:8px;
    }

    .place{
      padding:10px;
      border-radius:12px;
      background:rgba(0,0,0,.16);
      border:1px solid rgba(255,255,255,.07);
    }

    .place strong{
      display:block;
      color:#eef3ff;
      font-size:.88rem;
      margin-bottom:3px;
    }

    .place span{
      color:var(--muted);
      font-size:.78rem;
      line-height:1.45;
    }

    .character-grid{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:16px;
    }

    .character-card{
      min-width:0;
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:22px;
      overflow:hidden;
      box-shadow:var(--shadow);
    }

    .portrait{
      position:relative;
      aspect-ratio:16/10;
      overflow:hidden;
      background:
        radial-gradient(circle at 30% 20%, rgba(215,184,106,.14), transparent 34%),
        linear-gradient(145deg, #151c2c, #080b13);
      border-bottom:1px solid var(--line);
    }

    .portrait img{
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:center 22%;
      transition:transform .35s ease;
    }

    .character-card:hover .portrait img{transform:scale(1.025)}

    .portrait-fallback{
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
      padding:20px;
      color:#8e9ab1;
      text-align:center;
      line-height:1.6;
      font-size:.82rem;
    }

    .portrait.has-image .portrait-fallback{display:none}

    .card-body{padding:17px}

    .title-row{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
    }

    .character-card h3{
      margin:0;
      font-size:1.12rem;
    }

    .roman{
      display:block;
      color:#d5bd77;
      font-size:.73rem;
      margin-top:4px;
      letter-spacing:.06em;
    }

    .role-badge{
      padding:6px 9px;
      border-radius:999px;
      border:1px solid var(--line);
      color:#bdc8dc;
      font-size:.72rem;
      white-space:nowrap;
    }

    .summary{
      color:#bac6da;
      line-height:1.65;
      font-size:.9rem;
      margin:13px 0 0;
    }

    .meta-line{
      display:flex;
      flex-wrap:wrap;
      gap:6px;
      margin-top:13px;
    }

    .meta-line span{
      font-size:.72rem;
      color:#d8e0ef;
      border:1px solid rgba(255,255,255,.09);
      background:rgba(255,255,255,.035);
      border-radius:999px;
      padding:5px 8px;
    }

    details.character-details{
      margin-top:14px;
      border-top:1px solid var(--line);
    }

    .detail-toggle{
      padding:13px 0 0;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      color:#e8eefb;
      font-size:.86rem;
      font-weight:700;
    }

    .detail-content{
      padding-top:12px;
      color:#bec9dc;
      font-size:.86rem;
      line-height:1.7;
    }

    .detail-content dl{
      margin:0;
      display:grid;
      grid-template-columns:82px 1fr;
      gap:7px 10px;
    }

    .detail-content dt{color:#8390a7}
    .detail-content dd{margin:0;color:#d3daea}

    .lore-copy{
      margin:13px 0 0;
      padding-top:13px;
      border-top:1px dashed rgba(255,255,255,.1);
    }

    .footer{
      border-top:1px solid var(--line);
      color:#7f8ba0;
      text-align:center;
      padding:24px 18px 34px;
      font-size:.78rem;
    }

    .accent-dot{
      display:inline-block;
      width:7px;
      height:7px;
      border-radius:50%;
      background:var(--accent);
      box-shadow:0 0 18px rgba(215,184,106,.65);
      margin-right:8px;
      vertical-align:1px;
    }

    .notice{
      margin-top:14px;
      padding:13px 15px;
      color:#aab6cb;
      font-size:.82rem;
      line-height:1.6;
      border:1px dashed rgba(255,255,255,.12);
      border-radius:14px;
      background:rgba(0,0,0,.12);
    }

    @media (max-width:980px){
      .world-grid{grid-template-columns:1fr}
      .character-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
      .place-list{grid-template-columns:1fr}
    }

    @media (max-width:720px){
      .header-inner{align-items:flex-start; flex-direction:column}
      .top-nav{
        width:100%;
        margin-left:0;
        justify-content:flex-start;
        flex-wrap:nowrap;
        overflow-x:auto;
        padding-bottom:2px;
      }
      .nav-btn{flex:none}
      main{padding:22px 14px 52px}
      .hero{padding:28px 22px; min-height:250px; border-radius:24px}
      .region-grid{grid-template-columns:1fr}
      .character-grid{grid-template-columns:1fr}
      .mandala-map{min-height:360px}
      .map-node{font-size:.67rem;padding:7px 8px}
    }

    @media (prefers-reduced-motion:reduce){
      html{scroll-behavior:auto}
      *,*::before,*::after{animation:none!important; transition:none!important}
    }
  
    /* =========================================================
       BGM PLAYER
       - 우측 하단 고정형
       - 모바일에서는 재생/정지 버튼만 표시
       ========================================================= */
    .bgm-player{
      position:fixed;
      right:22px;
      bottom:22px;
      z-index:100;
      display:flex;
      align-items:center;
      gap:12px;
      min-width:300px;
      max-width:min(390px, calc(100vw - 28px));
      padding:12px 14px;
      border:1px solid rgba(255,255,255,.12);
      border-radius:18px;
      background:rgba(9,14,25,.84);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
      box-shadow:0 14px 40px rgba(0,0,0,.38);
      transition:opacity .2s ease, transform .2s ease, border-color .2s ease;
    }

    .bgm-player:hover{
      border-color:rgba(215,184,106,.26);
    }

    .bgm-player.is-playing{
      box-shadow:
        0 14px 40px rgba(0,0,0,.38),
        0 0 28px rgba(215,184,106,.08);
    }

    .bgm-toggle{
      width:42px;
      height:42px;
      flex:none;
      display:grid;
      place-items:center;
      border-radius:50%;
      border:1px solid rgba(215,184,106,.45);
      background:rgba(215,184,106,.10);
      color:#f5d98d;
      cursor:pointer;
      font-weight:800;
      transition:.18s ease;
    }

    .bgm-toggle:hover{
      background:rgba(215,184,106,.18);
      transform:translateY(-1px);
    }

    .bgm-toggle:focus-visible,
    .bgm-volume:focus-visible{
      outline:2px solid rgba(122,167,255,.7);
      outline-offset:3px;
    }

    .bgm-info{
      min-width:0;
      flex:1;
    }

    .bgm-label{
      display:block;
      color:#8f9bb1;
      font-size:.62rem;
      letter-spacing:.16em;
      margin-bottom:3px;
    }

    .bgm-title{
      display:block;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      font-size:.8rem;
      color:#edf2ff;
    }

    .bgm-volume-wrap{
      display:flex;
      align-items:center;
      gap:7px;
      color:#8f9bb1;
      font-size:.72rem;
    }

    .bgm-volume{
      width:76px;
      cursor:pointer;
      accent-color:#d7b86a;
    }

    @media(max-width:720px){
      .bgm-player{
        right:12px;
        bottom:12px;
        min-width:0;
        width:auto;
        padding:8px;
        border-radius:999px;
      }

      .bgm-info,
      .bgm-volume-wrap{
        display:none;
      }

      .bgm-toggle{
        width:44px;
        height:44px;
      }
    }

  
    /* =========================================================
       CHARACTER IMAGE DETAIL MODAL
       - 캐릭터 이미지를 클릭하면 확대 이미지 + 상세 설정 표시
       ========================================================= */
    .portrait{
      cursor:zoom-in;
    }

    .portrait::after{
      content:"상세 보기";
      position:absolute;
      right:12px;
      bottom:12px;
      z-index:2;
      padding:6px 9px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.14);
      background:rgba(7,10,18,.72);
      color:#eaf0ff;
      font-size:.7rem;
      letter-spacing:.04em;
      opacity:0;
      transform:translateY(4px);
      transition:.18s ease;
      pointer-events:none;
      backdrop-filter:blur(10px);
    }

    .character-card:hover .portrait::after,
    .portrait:focus-visible::after{
      opacity:1;
      transform:none;
    }

    .portrait:focus-visible{
      outline:2px solid rgba(122,167,255,.8);
      outline-offset:-2px;
    }

    .character-modal{
      width:min(1040px, calc(100vw - 28px));
      max-height:min(88vh, 900px);
      padding:0;
      border:none;
      border-radius:26px;
      overflow:hidden;
      color:var(--text);
      background:rgba(10,14,24,.97);
      box-shadow:0 30px 100px rgba(0,0,0,.6);
    }

    .character-modal::backdrop{
      background:rgba(2,4,9,.76);
      backdrop-filter:blur(8px);
      -webkit-backdrop-filter:blur(8px);
    }

    .modal-shell{
      display:grid;
      grid-template-columns:minmax(0,1.08fr) minmax(320px,.92fr);
      max-height:88vh;
    }

    .modal-image-wrap{
      position:relative;
      min-height:520px;
      background:
        radial-gradient(circle at 30% 20%, rgba(215,184,106,.13), transparent 35%),
        linear-gradient(145deg,#141b2a,#080b13);
      overflow:hidden;
    }

    .modal-image-wrap img{
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:center 20%;
    }

    .modal-image-fallback{
      position:absolute;
      inset:0;
      display:none;
      place-items:center;
      padding:28px;
      text-align:center;
      color:#8f9bb1;
      line-height:1.7;
    }

    .modal-info{
      overflow:auto;
      padding:34px 30px 36px;
      border-left:1px solid var(--line);
    }

    .modal-kicker{
      color:#d8bd74;
      font-size:.72rem;
      font-weight:700;
      letter-spacing:.15em;
      text-transform:uppercase;
      margin-bottom:8px;
    }

    .modal-title{
      margin:0;
      font-size:clamp(1.7rem,4vw,2.5rem);
      line-height:1.15;
    }

    .modal-roman{
      display:block;
      margin-top:7px;
      color:#9eacc3;
      font-size:.84rem;
    }

    .modal-epithet{
      margin:15px 0 0;
      color:#f0dfaa;
      font-size:.95rem;
    }

    .modal-tags{
      display:flex;
      flex-wrap:wrap;
      gap:7px;
      margin:18px 0 0;
    }

    .modal-tags span{
      padding:6px 9px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.1);
      background:rgba(255,255,255,.035);
      color:#dbe4f4;
      font-size:.74rem;
    }

    .modal-section{
      margin-top:24px;
      padding-top:20px;

function esc(str=""){
  return String(str).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

function portraitHTML(character){
  return `
    <div class="portrait" data-portrait data-character-id="${esc(character.id)}"
         role="button" tabindex="0"
         aria-label="${esc(character.name)} 상세 이미지 및 설정 보기">
      <img src="${esc(character.image)}" alt="${esc(character.name)} 프로필 일러스트"
           loading="lazy" decoding="async">
      <div class="portrait-fallback">
        <div>
          <strong>${esc(character.name)}</strong><br>
          이미지 파일을<br>
          <code>${esc(character.image.replace("./",""))}</code><br>
          경로에 넣으면 자동 표시됩니다.
        </div>
      </div>
    </div>
  `;
}

function attachImageFallbacks(){
  document.querySelectorAll("[data-portrait]").forEach(box => {
    const img = box.querySelector("img");
    if(!img) return;

    const mark = () => box.classList.add("has-image");
    const fail = () => {
      box.classList.remove("has-image");
      img.style.display = "none";
    };

    if(img.complete){
      if(img.naturalWidth > 0) mark();
      else fail();
    }
    img.addEventListener("load", mark, {once:true});
    img.addEventListener("error", fail, {once:true});
  });
}

function attachRegionMap(){
  document.querySelectorAll("[data-region]").forEach(btn => {
    btn.addEventListener("click", () => {
      const target = document.querySelector("#region-" + btn.dataset.region);
      if(!target) return;
      target.open = true;
      target.scrollIntoView({behavior:"smooth", block:"center"});
    });
  });
}


/* =========================================================
   4) 페이지 라우팅
   - 실제 파일은 index.html 하나지만
     #continent / #trimurti / #guardians / #retainers / #companions
     5페이지처럼 동작합니다.
   ========================================================= */

const ROUTES = ["continent","trimurti","guardians","retainers","companions"];

function currentRoute(){
  const raw = location.hash.replace("#","").split("/")[0];
  return ROUTES.includes(raw) ? raw : "continent";
}

function showRoute(route, pushHash=true){
  if(!ROUTES.includes(route)) route = "continent";

  document.querySelectorAll(".page").forEach(p => p.classList.remove("is-active"));
  document.querySelector("#page-" + route).classList.add("is-active");

  document.querySelectorAll(".nav-btn").forEach(btn => {
    btn.setAttribute("aria-selected", String(btn.dataset.route === route));
  });

  if(pushHash && location.hash !== "#" + route){
    history.pushState(null, "", "#" + route);
  }

  window.scrollTo({top:0, behavior:"smooth"});
}

function attachRouting(){
  document.querySelectorAll("[data-route]").forEach(el => {
    const go = () => showRoute(el.dataset.route);
    el.addEventListener("click", go);
    el.addEventListener("keydown", e => {
      if(e.key === "Enter" || e.key === " "){
        e.preventDefault();
        go();
      }
    });
  });

  window.addEventListener("hashchange", () => showRoute(currentRoute(), false));
}

const characterModal = document.querySelector("#characterModal");
const modalClose = document.querySelector("#modalClose");
const modalImage = document.querySelector("#modalImage");
const modalImageWrap = document.querySelector("#modalImageWrap");
const modalImageFallback = document.querySelector("#modalImageFallback");

function openCharacterModal(characterId){
  const c = CHARACTERS.find(x => x.id === characterId);
  if(!c || !characterModal) return;

  const kickerMap = {
    trimurti: "PRIMORDIAL DRAGON DEITY",
    guardian: `${c.direction || ""} DIRECTIONAL DRAGON`,
    retainer: "DIVINE RETAINER",
    companion: "JOURNEY COMPANION"
  };

  document.querySelector("#modalKicker").textContent = kickerMap[c.group] || "CHARACTER PROFILE";
  document.querySelector("#modalTitle").textContent = `${c.title} ${c.name}`;
  document.querySelector("#modalRoman").textContent = c.roman;
  document.querySelector("#modalEpithet").textContent = `「${c.epithet}」`;

  const modalAffiliationLabel = document.querySelector("#modalAffiliationLabel");
  modalAffiliationLabel.textContent =
    (c.group === "trimurti" || c.group === "guardian") ? "담당 국가" : "소속";

  const modalGenderLabel = document.querySelector("#modalGenderLabel");
  const modalGender = document.querySelector("#modalGender");
  if(c.gender){
    modalGenderLabel.style.display = "";
    modalGender.style.display = "";
    modalGender.textContent = c.gender;
  }else{
    modalGenderLabel.style.display = "none";
    modalGender.style.display = "none";
    modalGender.textContent = "";
  }

  document.querySelector("#modalCountry").textContent = c.country;
  document.querySelector("#modalColors").textContent = c.colors;
  document.querySelector("#modalPersonality").textContent = c.personality;
  document.querySelector("#modalAppearance").textContent = c.appearance;
  document.querySelector("#modalLore").textContent = c.lore;

  const tags = document.querySelector("#modalTags");
  tags.innerHTML = c.domain.map(x => `<span>${esc(x)}</span>`).join("");

  modalImage.style.display = "block";
  modalImageFallback.style.display = "none";
  modalImage.src = c.image;
  modalImage.alt = `${c.name} 프로필 일러스트 확대`;

  modalImage.onload = () => {
    modalImage.style.display = "block";
    modalImageFallback.style.display = "none";
  };

  modalImage.onerror = () => {
    modalImage.style.display = "none";
    modalImageFallback.style.display = "grid";
  };

  characterModal.showModal();
}

function attachPortraitModals(){
  document.querySelectorAll("[data-portrait][data-character-id]").forEach(box => {

        e.preventDefault();

}

if(characterModal){

  characterModal.addEventListener("click", e => {
    if(e.target === characterModal){
      characterModal.close();
    }
  });
}

/* =========================================================
   7) BGM 플레이어
   - 페이지는 해시 라우팅이라 5개 아카이브 페이지 이동 중 음악이 끊기지 않습니다.
   - 자동재생은 브라우저 정책상 사용하지 않습니다.
   ========================================================= */

const bgmPlayer = document.querySelector("#bgmPlayer");
const bgmAudio = document.querySelector("#bgmAudio");
const bgmToggle = document.querySelector("#bgmToggle");
const bgmVolume = document.querySelector("#bgmVolume");

if (bgmAudio && bgmToggle && bgmVolume) {
  // 초기 볼륨
  bgmAudio.volume = Number(bgmVolume.value);

  // 사용자가 마지막으로 설정한 볼륨을 같은 브라우저에서 기억
  const savedVolume = localStorage.getItem("avarthara-bgm-volume");
  if (savedVolume !== null) {
    const parsed = Math.min(1, Math.max(0, Number(savedVolume)));
    if (!Number.isNaN(parsed)) {
      bgmAudio.volume = parsed;
      bgmVolume.value = String(parsed);
    }
  }

  function syncBgmButton() {
    const playing = !bgmAudio.paused;
    bgmToggle.textContent = playing ? "Ⅱ" : "▶";
    bgmToggle.setAttribute("aria-label", playing ? "BGM 일시정지" : "BGM 재생");
    bgmToggle.setAttribute("aria-pressed", String(playing));
    bgmPlayer?.classList.toggle("is-playing", playing);
  }

  bgmToggle.addEventListener("click", async () => {
    if (bgmAudio.paused) {
      try {
        await bgmAudio.play();
      } catch (err) {
        console.warn("BGM 재생 실패:", err);
      }
    } else {
      bgmAudio.pause();
    }
    syncBgmButton();
  });

  bgmVolume.addEventListener("input", () => {
    const value = Number(bgmVolume.value);
    bgmAudio.volume = value;
    localStorage.setItem("avarthara-bgm-volume", String(value));
  });

  bgmAudio.addEventListener("play", syncBgmButton);
  bgmAudio.addEventListener("pause", syncBgmButton);
  bgmAudio.addEventListener("ended", syncBgmButton);
  bgmAudio.addEventListener("error", () => {
    console.warn("BGM 파일을 불러오지 못했습니다. assets/audio/main-theme.mp3 경로를 확인하세요.");
    bgmToggle.title = "BGM 파일을 찾을 수 없습니다.";
  });

  syncBgmButton();
}
