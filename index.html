<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b1020" />
  <meta name="description" content="아바르타라 세계관 아카이브" />
  <title>아바르타라 세계관 아카이브</title>

  <style>
    :root{
      --bg:#070a12;
      --panel:rgba(16,22,38,.74);
      --line:rgba(255,255,255,.11);
      --text:#edf2ff;
      --muted:#aab5cc;
      --accent:#d7b86a;
      --shadow:0 18px 60px rgba(0,0,0,.35);
      --radius:24px;
      --max:1240px;
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      color:var(--text);
      min-height:100vh;
      overflow-x:hidden;
      font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
      background:
        radial-gradient(circle at 15% 15%,rgba(95,120,220,.16),transparent 30%),
        radial-gradient(circle at 85% 20%,rgba(220,174,90,.12),transparent 28%),
        radial-gradient(circle at 50% 85%,rgba(72,150,135,.10),transparent 32%),
        linear-gradient(180deg,#070a12 0%,#0b1020 55%,#070a12 100%);
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      z-index:-2;
      opacity:.14;
      pointer-events:none;
      background-image:
        linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);
      background-size:42px 42px;
      mask-image:linear-gradient(to bottom,rgba(0,0,0,.8),transparent 86%);
    }

    body::after{
      content:"";
      position:fixed;
      inset:-20%;
      z-index:-3;
      pointer-events:none;
      opacity:.08;
      filter:saturate(.7) contrast(1.1);
      background:url("./assets/ui/background.webp") center/cover no-repeat;
    }

    button,input{font:inherit}
    img{display:block;max-width:100%}

    .site-header{
      position:sticky;
      top:0;
      z-index:50;
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
      background:rgba(7,10,18,.76);
      border-bottom:1px solid var(--line);
    }

    .header-inner{
      max-width:var(--max);
      margin:auto;
      min-height:72px;
      padding:12px 22px;
      display:flex;
      align-items:center;
      gap:18px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:max-content;
      cursor:pointer;
      user-select:none;
    }

    .brand-mark{
      width:38px;height:38px;
      border:1px solid rgba(215,184,106,.6);
      border-radius:50%;
      display:grid;place-items:center;
      color:var(--accent);
      background:radial-gradient(circle,rgba(215,184,106,.17),transparent 62%);
    }
    .brand-mark::before{content:"✦";font-size:18px}
    .brand-text strong{display:block;letter-spacing:.08em;font-size:.96rem}
    .brand-text small{display:block;color:var(--muted);font-size:.72rem;margin-top:2px}

    .top-nav{
      margin-left:auto;
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    .nav-btn{
      border:1px solid transparent;
      color:var(--muted);
      background:transparent;
      padding:9px 13px;
      border-radius:999px;
      cursor:pointer;
      transition:.18s ease;
      white-space:nowrap;
    }
    .nav-btn:hover{color:var(--text);background:rgba(255,255,255,.055)}
    .nav-btn[aria-selected="true"]{
      color:#fff6d9;
      border-color:rgba(215,184,106,.38);
      background:rgba(215,184,106,.12);
    }

    main{max-width:var(--max);margin:0 auto;padding:34px 22px 70px}
    .page{display:none;animation:fade .22s ease}
    .page.is-active{display:block}
    @keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

    .hero{
      position:relative;
      min-height:280px;
      border:1px solid var(--line);
      border-radius:32px;
      overflow:hidden;
      padding:42px;
      display:flex;
      flex-direction:column;
      justify-content:flex-end;
      background:
        linear-gradient(120deg,rgba(7,10,18,.94),rgba(8,14,29,.67)),
        var(--hero-image,none);
      background-position:center;
      background-size:cover;
      box-shadow:var(--shadow);
    }
    .hero::after{
      content:"";position:absolute;inset:0;pointer-events:none;
      background:radial-gradient(circle at 78% 26%,rgba(215,184,106,.12),transparent 25%),linear-gradient(to top,rgba(7,10,18,.55),transparent 50%);
    }
    .hero>*{position:relative;z-index:1}
    .eyebrow{color:#e4c981;text-transform:uppercase;letter-spacing:.16em;font-size:.74rem;font-weight:700;margin-bottom:10px}
    .hero h1{margin:0;font-size:clamp(2rem,6vw,4.9rem);line-height:1;letter-spacing:-.045em;max-width:900px}
    .hero p{color:#c6d0e5;max-width:800px;font-size:1.02rem;line-height:1.75;margin:18px 0 0}

    .section{margin-top:34px}
    .section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:16px}
    .section-head h2{margin:0;font-size:clamp(1.35rem,3vw,2rem)}
    .section-head p{margin:7px 0 0;color:var(--muted);line-height:1.65;max-width:760px}
    .pill{display:inline-flex;align-items:center;padding:7px 10px;border:1px solid var(--line);border-radius:999px;color:var(--muted);background:rgba(255,255,255,.035);font-size:.78rem;white-space:nowrap}

    .glass,.character-card,.setting-card{
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      backdrop-filter:blur(12px);
    }

    .world-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:18px}
    .lore-panel{padding:24px}
    .lore-panel h3{margin:0 0 10px;font-size:1.2rem}
    .lore-panel p{margin:0;color:#c7d0e3;line-height:1.8}
    .notice{margin-top:14px;padding:13px 15px;color:#aab6cb;font-size:.82rem;line-height:1.6;border:1px dashed rgba(255,255,255,.12);border-radius:14px;background:rgba(0,0,0,.12)}

    .mandala-map{
      min-height:430px;position:relative;overflow:hidden;border-radius:var(--radius);
      background:
        radial-gradient(circle at center,rgba(215,184,106,.11),transparent 18%),
        radial-gradient(circle at center,transparent 0 31%,rgba(255,255,255,.07) 31.5% 32%,transparent 32.5%),
        radial-gradient(circle at center,transparent 0 45%,rgba(255,255,255,.045) 45.5% 46%,transparent 46.5%),
        linear-gradient(145deg,rgba(20,29,49,.86),rgba(8,12,22,.88));
      border:1px solid var(--line);
    }
    .map-node{position:absolute;transform:translate(-50%,-50%);border:1px solid rgba(255,255,255,.14);background:rgba(9,14,25,.86);color:#dfe6f6;border-radius:999px;padding:8px 10px;font-size:.76rem;cursor:pointer;white-space:nowrap;transition:.18s ease;box-shadow:0 8px 24px rgba(0,0,0,.28)}
    .map-node:hover{border-color:rgba(215,184,106,.55);color:#fff6d9;transform:translate(-50%,-50%) scale(1.04)}
    .map-node.core{padding:14px 16px;font-weight:800;color:#fff1c6;border-color:rgba(215,184,106,.5);background:rgba(43,35,18,.8)}

    .region-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
    details.region{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:18px;overflow:hidden}
    details.region[open]{background:rgba(255,255,255,.052)}
    details summary{list-style:none;cursor:pointer}
    details summary::-webkit-details-marker{display:none}
    .region-summary{padding:17px 18px;display:flex;justify-content:space-between;gap:18px;align-items:center}
    .region-summary strong{display:block}
    .region-summary small{display:block;color:var(--muted);margin-top:4px}
    .chev{width:28px;height:28px;flex:none;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);transition:transform .2s ease}
    details[open] .chev{transform:rotate(45deg)}
    .region-body{border-top:1px solid var(--line);padding:16px 18px 19px;color:#c7d0e3;line-height:1.75}
    .region-body p{margin:0 0 12px}
    .place-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
    .place{padding:10px;border-radius:12px;background:rgba(0,0,0,.16);border:1px solid rgba(255,255,255,.07)}
    .place strong{display:block;color:#eef3ff;font-size:.88rem;margin-bottom:3px}
    .place span{color:var(--muted);font-size:.78rem;line-height:1.45}

    .character-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
    .character-card{min-width:0;overflow:hidden;border-radius:22px}
    .portrait{position:relative;aspect-ratio:16/10;overflow:hidden;cursor:zoom-in;background:radial-gradient(circle at 30% 20%,rgba(215,184,106,.14),transparent 34%),linear-gradient(145deg,#151c2c,#080b13);border-bottom:1px solid var(--line)}
    .portrait img{width:100%;height:100%;object-fit:cover;object-position:center 22%;transition:transform .35s ease}
    .character-card:hover .portrait img{transform:scale(1.025)}
    .portrait::after{content:"상세 보기";position:absolute;right:12px;bottom:12px;z-index:2;padding:6px 9px;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:rgba(7,10,18,.72);color:#eaf0ff;font-size:.7rem;opacity:0;transform:translateY(4px);transition:.18s ease;pointer-events:none}
    .character-card:hover .portrait::after,.portrait:focus-visible::after{opacity:1;transform:none}
    .portrait-fallback{position:absolute;inset:0;display:grid;place-items:center;padding:20px;color:#8e9ab1;text-align:center;line-height:1.6;font-size:.82rem}
    .portrait.has-image .portrait-fallback{display:none}
    .card-body{padding:17px}
    .title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
    .character-card h3{margin:0;font-size:1.12rem}
    .roman{display:block;color:#d5bd77;font-size:.73rem;margin-top:4px;letter-spacing:.06em}
    .role-badge{padding:6px 9px;border-radius:999px;border:1px solid var(--line);color:#bdc8dc;font-size:.72rem;white-space:nowrap}
    .summary{color:#bac6da;line-height:1.65;font-size:.9rem;margin:13px 0 0}
    .meta-line{display:flex;flex-wrap:wrap;gap:6px;margin-top:13px}
    .meta-line span{font-size:.72rem;color:#d8e0ef;border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.035);border-radius:999px;padding:5px 8px}
    details.character-details{margin-top:14px;border-top:1px solid var(--line);overflow:hidden}
    .detail-toggle{padding:13px 0 0;display:flex;align-items:center;justify-content:space-between;gap:10px;color:#e8eefb;font-size:.86rem;font-weight:700}
    .detail-content{padding-top:12px;color:#bec9dc;font-size:.86rem;line-height:1.7}
    .detail-content dl{margin:0;display:grid;grid-template-columns:82px 1fr;gap:7px 10px}
    .detail-content dt{color:#8390a7}.detail-content dd{margin:0;color:#d3daea}
    .lore-copy{margin:13px 0 0;padding-top:13px;border-top:1px dashed rgba(255,255,255,.1)}

    /* 주요 설정 페이지 */
    .setting-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
    .setting-card{padding:26px;position:relative;overflow:hidden}
    .setting-card::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 5%,rgba(215,184,106,.10),transparent 30%);pointer-events:none}
    .setting-card>*{position:relative;z-index:1}
    .setting-index{font-size:.72rem;color:#d6bb73;letter-spacing:.16em;margin-bottom:10px}
    .setting-card h3{margin:0;font-size:clamp(1.4rem,3vw,2rem)}
    .setting-card .setting-en{display:block;color:#8794aa;font-size:.78rem;margin-top:5px;letter-spacing:.08em}
    .setting-card p{color:#c3cddd;line-height:1.8;margin:18px 0 0}
    .setting-note{margin-top:18px;padding:13px 14px;border-radius:14px;border:1px dashed rgba(255,255,255,.12);color:#9ba8bd;background:rgba(0,0,0,.14);font-size:.82rem;line-height:1.65}
    .setting-points{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px}
    .setting-points span{padding:6px 9px;border:1px solid rgba(255,255,255,.10);border-radius:999px;background:rgba(255,255,255,.035);font-size:.75rem;color:#d8e1f0}

    /* 캐릭터 상세 모달 */
    .character-modal{width:min(1040px,calc(100vw - 28px));max-height:min(88vh,900px);padding:0;border:none;border-radius:26px;overflow:hidden;color:var(--text);background:rgba(10,14,24,.97);box-shadow:0 30px 100px rgba(0,0,0,.6)}
    .character-modal::backdrop{background:rgba(2,4,9,.76);backdrop-filter:blur(8px)}
    .modal-shell{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(320px,.92fr);max-height:88vh}
    .modal-image-wrap{position:relative;min-height:520px;background:radial-gradient(circle at 30% 20%,rgba(215,184,106,.13),transparent 35%),linear-gradient(145deg,#141b2a,#080b13);overflow:hidden}
    .modal-image-wrap img{width:100%;height:100%;object-fit:cover;object-position:center 20%}
    .modal-image-fallback{position:absolute;inset:0;display:none;place-items:center;padding:28px;text-align:center;color:#8f9bb1;line-height:1.7}
    .modal-info{overflow:auto;padding:34px 30px 36px;border-left:1px solid var(--line)}
    .modal-kicker{color:#d8bd74;font-size:.72rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;margin-bottom:8px}
    .modal-title{margin:0;font-size:clamp(1.7rem,4vw,2.5rem);line-height:1.15}
    .modal-roman{display:block;margin-top:7px;color:#9eacc3;font-size:.84rem}
    .modal-epithet{margin:15px 0 0;color:#f0dfaa;font-size:.95rem}
    .modal-tags{display:flex;flex-wrap:wrap;gap:7px;margin:18px 0 0}
    .modal-tags span{padding:6px 9px;border-radius:999px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.035);color:#dbe4f4;font-size:.74rem}
    .modal-section{margin-top:24px;padding-top:20px;border-top:1px solid var(--line)}
    .modal-section h4{margin:0 0 9px;font-size:.86rem}.modal-section p{margin:0;color:#bec9dc;line-height:1.78;font-size:.9rem}
    .modal-meta{display:grid;grid-template-columns:82px 1fr;gap:8px 12px;margin:0;font-size:.88rem}.modal-meta dt{color:#7f8da6}.modal-meta dd{margin:0;color:#d6deed}
    .modal-close{position:absolute;top:14px;right:14px;z-index:5;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.14);background:rgba(7,10,18,.76);color:white;cursor:pointer;font-size:1.15rem}

    /* BGM */
    .bgm-player{position:fixed;right:22px;bottom:22px;z-index:100;display:flex;align-items:center;gap:12px;min-width:300px;max-width:min(390px,calc(100vw - 28px));padding:12px 14px;border:1px solid rgba(255,255,255,.12);border-radius:18px;background:rgba(9,14,25,.84);backdrop-filter:blur(18px);box-shadow:0 14px 40px rgba(0,0,0,.38)}
    .bgm-toggle{width:42px;height:42px;flex:none;display:grid;place-items:center;border-radius:50%;border:1px solid rgba(215,184,106,.45);background:rgba(215,184,106,.10);color:#f5d98d;cursor:pointer;font-weight:800}
    .bgm-info{min-width:0;flex:1}.bgm-label{display:block;color:#8f9bb1;font-size:.62rem;letter-spacing:.16em;margin-bottom:3px}.bgm-title{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.8rem;color:#edf2ff}.bgm-volume-wrap{display:flex;align-items:center;gap:7px;color:#8f9bb1;font-size:.72rem}.bgm-volume{width:76px;cursor:pointer;accent-color:#d7b86a}

    .footer{border-top:1px solid var(--line);color:#7f8ba0;text-align:center;padding:24px 18px 34px;font-size:.78rem}

    @media(max-width:1000px){
      .world-grid{grid-template-columns:1fr}.character-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.place-list{grid-template-columns:1fr}.setting-grid{grid-template-columns:1fr}
    }
    @media(min-width:721px) and (max-width:1180px){
      .header-inner{align-items:flex-start;flex-direction:column}.top-nav{width:100%;margin-left:0;justify-content:flex-start;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}.nav-btn{flex:none}
    }
    @media(max-width:720px){
      .header-inner{align-items:flex-start;flex-direction:column}.top-nav{width:100%;margin-left:0;justify-content:flex-start;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}.nav-btn{flex:none}
      main{padding:22px 14px 52px}.hero{padding:28px 22px;min-height:250px;border-radius:24px}.region-grid,.character-grid{grid-template-columns:1fr}.mandala-map{min-height:360px}
      .bgm-player{right:12px;bottom:12px;min-width:0;width:auto;padding:8px;border-radius:999px}.bgm-info,.bgm-volume-wrap{display:none}.bgm-toggle{width:44px;height:44px}
      .character-modal{width:min(96vw,680px);max-height:92vh}.modal-shell{display:block;overflow:auto;max-height:92vh}.modal-image-wrap{min-height:0;aspect-ratio:4/3}.modal-info{border-left:none;border-top:1px solid var(--line);overflow:visible;padding:24px 20px 30px}
    }
  </style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="brand" data-route="continent" role="button" tabindex="0" aria-label="대륙 소개로 이동">
      <div class="brand-mark"></div>
      <div class="brand-text"><strong>AVARTHARA ARCHIVE</strong><small>아바르타라 세계관 기록보관소</small></div>
    </div>

    <nav class="top-nav" aria-label="주요 페이지">
      <button class="nav-btn" data-route="continent">대륙 소개</button>
      <button class="nav-btn" data-route="trimurti">삼주룡</button>
      <button class="nav-btn" data-route="guardians">십방위룡</button>
      <button class="nav-btn" data-route="retainers">용신의 권속</button>
      <button class="nav-btn" data-route="companions">동료 고행자</button>
      <button class="nav-btn" data-route="settings">주요 설정</button>
    </nav>
  </div>
</header>

<main>
  <section id="page-continent" class="page"></section>
  <section id="page-trimurti" class="page"></section>
  <section id="page-guardians" class="page"></section>
  <section id="page-retainers" class="page"></section>
  <section id="page-companions" class="page"></section>
  <section id="page-settings" class="page"></section>
</main>

<footer class="footer">✦ AVARTHARA ARCHIVE · GitHub Pages ready · Single-file HTML</footer>

<!-- 캐릭터 상세 모달 -->
<dialog class="character-modal" id="characterModal" aria-labelledby="modalTitle">
  <div class="modal-shell">
    <div class="modal-image-wrap">
      <button class="modal-close" id="modalClose" type="button" aria-label="닫기">×</button>
      <img id="modalImage" src="" alt="">
      <div class="modal-image-fallback" id="modalImageFallback">등록된 캐릭터 이미지가 없습니다.</div>
    </div>
    <div class="modal-info">
      <div class="modal-kicker" id="modalKicker"></div>
      <h2 class="modal-title" id="modalTitle"></h2>
      <span class="modal-roman" id="modalRoman"></span>
      <p class="modal-epithet" id="modalEpithet"></p>
      <div class="modal-tags" id="modalTags"></div>
      <section class="modal-section">
        <dl class="modal-meta">
          <dt id="modalGenderLabel" style="display:none">성별</dt><dd id="modalGender" style="display:none"></dd>
          <dt id="modalAffiliationLabel">담당 국가</dt><dd id="modalCountry"></dd>
          <dt>색상</dt><dd id="modalColors"></dd>
          <dt>성격</dt><dd id="modalPersonality"></dd>
        </dl>
      </section>
      <section class="modal-section"><h4>외형</h4><p id="modalAppearance"></p></section>
      <section class="modal-section"><h4>설정</h4><p id="modalLore"></p></section>
    </div>
  </div>
</dialog>

<!-- BGM 플레이어: assets/audio/main-theme.mp3 -->
<div class="bgm-player" id="bgmPlayer">
  <button class="bgm-toggle" id="bgmToggle" type="button" aria-label="BGM 재생">▶</button>
  <div class="bgm-info"><span class="bgm-label">NOW PLAYING</span><strong class="bgm-title">Mandala of Avarthara</strong></div>
  <label class="bgm-volume-wrap" for="bgmVolume"><span>VOL</span><input class="bgm-volume" id="bgmVolume" type="range" min="0" max="1" step="0.05" value="0.35"></label>
  <audio id="bgmAudio" loop preload="metadata"><source src="./assets/audio/main-theme.mp3" type="audio/mpeg"></audio>
</div>

<script>
/* =========================================================
   이미지 폴더 예시
   assets/ui/background.webp
   assets/world/mandalavarsha.webp
   assets/audio/main-theme.mp3
   assets/characters/*.webp
   ========================================================= */

    note:"일반적인 고행자들은 용신의 힘까지 닿을 정도로 강해지지는 못하나, 드물게 고행을 거듭하여 힘과 권능을 손에 넣은 고행자들은 용신에 필적할 힘을 지닌다. 그리고 이 경지에 오른 자들은 그 누구도 완수하지 못한 천 년 고행에 도전할 자격이 주어진다."
  }
];

function esc(str=""){return String(str).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}

const GROUP_LABELS={trimurti:"삼주룡",guardian:"십방위룡",retainer:"용신의 권속",companion:"여정의 동료"};

function portraitHTML(c){return `<div class="portrait" data-portrait data-character-id="${esc(c.id)}" role="button" tabindex="0" aria-label="${esc(c.name)} 상세 보기"><img src="${esc(c.image)}" alt="${esc(c.name)} 프로필 일러스트" loading="lazy"><div class="portrait-fallback"><div><strong>${esc(c.name)}</strong><br>이미지를 <code>${esc(c.image.replace("./",""))}</code><br>경로에 넣으면 자동 표시됩니다.</div></div></div>`}

function characterCard(c){
  const dir=c.direction?`${c.direction} · `:"";
  const affiliation=(c.group==="trimurti"||c.group==="guardian")?"담당 국가":"소속";
  return `<article class="character-card">${portraitHTML(c)}<div class="card-body"><div class="title-row"><div><h3>${esc(c.title)} ${esc(c.name)}</h3><span class="roman">${esc(c.roman)} · ${esc(c.epithet)}</span></div><span class="role-badge">${esc(dir+(GROUP_LABELS[c.group]||"인물"))}</span></div><p class="summary">${esc(c.summary)}</p><div class="meta-line">${c.gender?`<span>${esc(c.gender)}</span>`:""}${c.domain.map(x=>`<span>${esc(x)}</span>`).join("")}</div><details class="character-details"><summary class="detail-toggle"><span>상세 설정 펼치기</span><span class="chev">+</span></summary><div class="detail-content"><dl><dt>이명</dt><dd>${esc(c.epithet)}</dd>${c.gender?`<dt>성별</dt><dd>${esc(c.gender)}</dd>`:""}<dt>${affiliation}</dt><dd>${esc(c.country)}</dd><dt>색상</dt><dd>${esc(c.colors)}</dd><dt>성격</dt><dd>${esc(c.personality)}</dd><dt>외형</dt><dd>${esc(c.appearance)}</dd></dl><p class="lore-copy">${esc(c.lore)}</p></div></details></div></article>`;
}

function renderCharacterPage(targetId,group,title,subtitle,eyebrow){
  const list=CHARACTERS.filter(c=>c.group===group),el=document.querySelector(targetId);
  el.innerHTML=`<section class="hero"><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${subtitle}</p></section><section class="section"><div class="section-head"><div><h2>${title}</h2><p></p></div><span class="pill">${list.length} entries</span></div><div class="character-grid">${list.map(characterCard).join("")}</div></section>`;
}

function renderContinent(){
  const el=document.querySelector("#page-continent");
  el.innerHTML=`<section class="hero" style="--hero-image:url('${WORLD.heroImage}')"><div class="eyebrow">WORLD / CONTINENT</div><h1>${WORLD.worldName}<br>${WORLD.continentName}</h1><p>${WORLD.intro}</p></section>
  <section class="section"><div class="section-head"><div><h2>대륙 개요</h2><p>${WORLD.continentIntro}</p></div><span class="pill">${WORLD.worldRoman} · ${WORLD.continentRoman}</span></div><div class="world-grid"><div class="glass lore-panel"><h3>신성 질서</h3><p>중앙의 세 신성국을 여덟 방위국이 감싸고, 천정의 수리야트라와 지저의 파탈가르가 십방의 구조를 완성한다.</p><div class="notice"><b>assets/world/mandalavarsha.webp</b>를 넣으면 대륙 이미지가 상단 배경에 표시된다.</div></div><div class="mandala-map"><button class="map-node" data-region="maruvana" style="left:25%;top:24%">북서 · 마루바나</button><button class="map-node" data-region="ratnagar" style="left:50%;top:18%">북 · 라트나가르</button><button class="map-node" data-region="akashavia" style="left:75%;top:24%">북동 · 아카샤비아</button><button class="map-node" data-region="samudria" style="left:16%;top:50%">서 · 사무드리아</button><button class="map-node core" data-region="padmashara" style="left:50%;top:50%">삼주신성권</button><button class="map-node" data-region="vajrakar" style="left:84%;top:50%">동 · 바즈라카르</button><button class="map-node" data-region="visharat" style="left:25%;top:76%">남서 · 비샤라트</button><button class="map-node" data-region="dandrava" style="left:50%;top:82%">남 · 단드라바</button><button class="map-node" data-region="jvalagni" style="left:75%;top:76%">남동 · 즈발라그니</button><button class="map-node" data-region="suryatra" style="left:50%;top:7%">천정 · 수리야트라</button><button class="map-node" data-region="patalgar" style="left:50%;top:93%">지저 · 파탈가르</button></div></div></section>
  <section class="section"><div class="section-head"><div><h2>구역과 주요 장소</h2><p>각 국가를 클릭하면 설명과 주요 장소가 펼쳐진다.</p></div><span class="pill">${REGIONS.length} regions</span></div><div class="region-grid">${REGIONS.map(r=>`<details class="region" id="region-${r.id}"><summary class="region-summary"><div><strong>${r.name}</strong><small>${r.group} · ${r.subtitle}</small></div><span class="chev">+</span></summary><div class="region-body"><p>${r.desc}</p><p><b>관장 용신:</b> ${r.ruler}</p><div class="place-list">${r.places.map(p=>`<div class="place"><strong>${p[0]}</strong><span>${p[1]}</span></div>`).join("")}</div></div></details>`).join("")}</div></section>`;
}

function renderSettings(){
  document.querySelector("#page-settings").innerHTML=`<section class="hero"><div class="eyebrow">CORE LORE / WORLD RULES</div><h1>주요 설정</h1><p>아바르타라 세계의 핵심 개념을 빠르게 찾아볼 수 있는 설정집. 용신·아스트라·고행·고행자를 네 개의 큰 항목으로 나누어 정리한다.</p></section><section class="section"><div class="section-head"><div><h2>세계관 핵심 개념</h2><p></p></div><span class="pill">4 concepts</span></div><div class="setting-grid">${MAJOR_SETTINGS.map(s=>`<article class="setting-card" id="setting-${s.id}"><div class="setting-index">${s.index}</div><h3>${s.title}<span class="setting-en">${s.en}</span></h3><p>${s.summary}</p><div class="setting-points">${s.points.map(x=>`<span>${x}</span>`).join("")}</div><div class="setting-note">${s.note}</div></article>`).join("")}</div></section>`;
}

renderContinent();
renderCharacterPage("#page-trimurti","trimurti","세계를 유지하는 삼주룡","창세·유지·종언이라는 세계의 가장 근본적인 세 법칙을 담당하는 최고위 용신들.","THE THREE PRIMORDIAL DRAGONS");
renderCharacterPage("#page-guardians","guardian","십방위의 용","삼주룡 아래에서 십방의 자연현상과 경계를 관리하는 신격.","THE TEN DIRECTIONAL DRAGONS");
renderCharacterPage("#page-retainers","retainer","용신의 권속들","각 용신 곁에서 기록·행정·군사·장례·연금·계약·신탁 등 실무를 맡는 13명의 보좌관들.","THE DIVINE RETAINERS");
renderCharacterPage("#page-companions","companion","동료 고행자들","주인공과 함께 만다라바르샤를 횡단하는 네 명의 여행 동료.","THE JOURNEY COMPANIONS");
renderSettings();

function attachImageFallbacks(){document.querySelectorAll("[data-portrait]").forEach(box=>{const img=box.querySelector("img");const ok=()=>box.classList.add("has-image"),fail=()=>{box.classList.remove("has-image");img.style.display="none"};if(img.complete){img.naturalWidth?ok():fail()}img.addEventListener("load",ok,{once:true});img.addEventListener("error",fail,{once:true})})}

function attachRegionMap(){document.querySelectorAll("[data-region]").forEach(btn=>btn.addEventListener("click",()=>{const target=document.querySelector("#region-"+btn.dataset.region);if(target){target.open=true;target.scrollIntoView({behavior:"smooth",block:"center"})}}))}

const ROUTES=["continent","trimurti","guardians","retainers","companions","settings"];
function currentRoute(){const raw=location.hash.replace("#","").split("/")[0];return ROUTES.includes(raw)?raw:"continent"}
function showRoute(route,pushHash=true){if(!ROUTES.includes(route))route="continent";document.querySelectorAll(".page").forEach(p=>p.classList.remove("is-active"));document.querySelector("#page-"+route).classList.add("is-active");document.querySelectorAll(".nav-btn").forEach(btn=>btn.setAttribute("aria-selected",String(btn.dataset.route===route)));if(pushHash&&location.hash!=="#"+route)history.pushState(null,"","#"+route);window.scrollTo({top:0,behavior:"smooth"})}
function attachRouting(){document.querySelectorAll("[data-route]").forEach(el=>{const go=()=>showRoute(el.dataset.route);el.addEventListener("click",go);el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go()}})});window.addEventListener("hashchange",()=>showRoute(currentRoute(),false))}

const characterModal=document.querySelector("#characterModal"),modalClose=document.querySelector("#modalClose"),modalImage=document.querySelector("#modalImage"),modalImageFallback=document.querySelector("#modalImageFallback");
function openCharacterModal(id){const c=CHARACTERS.find(x=>x.id===id);if(!c)return;const kicker={trimurti:"PRIMORDIAL DRAGON DEITY",guardian:`${c.direction||""} DIRECTIONAL DRAGON`,retainer:"DIVINE RETAINER",companion:"JOURNEY COMPANION"};document.querySelector("#modalKicker").textContent=kicker[c.group]||"CHARACTER PROFILE";document.querySelector("#modalTitle").textContent=`${c.title} ${c.name}`;document.querySelector("#modalRoman").textContent=c.roman;document.querySelector("#modalEpithet").textContent=`「${c.epithet}」`;document.querySelector("#modalTags").innerHTML=c.domain.map(x=>`<span>${x}</span>`).join("");const gl=document.querySelector("#modalGenderLabel"),gv=document.querySelector("#modalGender");if(c.gender){gl.style.display="";gv.style.display="";gv.textContent=c.gender}else{gl.style.display="none";gv.style.display="none"}document.querySelector("#modalAffiliationLabel").textContent=(c.group==="trimurti"||c.group==="guardian")?"담당 국가":"소속";document.querySelector("#modalCountry").textContent=c.country;document.querySelector("#modalColors").textContent=c.colors;document.querySelector("#modalPersonality").textContent=c.personality;document.querySelector("#modalAppearance").textContent=c.appearance;document.querySelector("#modalLore").textContent=c.lore;modalImage.style.display="block";modalImageFallback.style.display="none";modalImage.src=c.image;modalImage.alt=`${c.name} 프로필 확대`;modalImage.onerror=()=>{modalImage.style.display="none";modalImageFallback.style.display="grid"};characterModal.showModal()}
function attachPortraitModals(){document.querySelectorAll("[data-portrait]").forEach(box=>{box.addEventListener("click",()=>openCharacterModal(box.dataset.characterId));box.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openCharacterModal(box.dataset.characterId)}})})}
modalClose.addEventListener("click",()=>characterModal.close());characterModal.addEventListener("click",e=>{if(e.target===characterModal)characterModal.close()});

const bgmAudio=document.querySelector("#bgmAudio"),bgmToggle=document.querySelector("#bgmToggle"),bgmVolume=document.querySelector("#bgmVolume");
const savedVolume=localStorage.getItem("avarthara-bgm-volume");if(savedVolume!==null)bgmVolume.value=savedVolume;bgmAudio.volume=Number(bgmVolume.value);function syncBgm(){const playing=!bgmAudio.paused;bgmToggle.textContent=playing?"Ⅱ":"▶";bgmToggle.setAttribute("aria-label",playing?"BGM 일시정지":"BGM 재생")}bgmToggle.addEventListener("click",async()=>{if(bgmAudio.paused){try{await bgmAudio.play()}catch(e){console.warn(e)}}else bgmAudio.pause();syncBgm()});bgmVolume.addEventListener("input",()=>{bgmAudio.volume=Number(bgmVolume.value);localStorage.setItem("avarthara-bgm-volume",bgmVolume.value)});bgmAudio.addEventListener("play",syncBgm);bgmAudio.addEventListener("pause",syncBgm);

attachImageFallbacks();attachRegionMap();attachRouting();attachPortraitModals();showRoute(currentRoute(),false);syncBgm();
</script>
</body>
</html>
