  <title>아바르타라 세계관 아카이브</title>
  <style>
:root {

* { box-sizing: border-box; }

  }
];
const GROUP_LABELS = { trimurti: "삼주룡", guardian: "십방위룡", retainer: "용신의 권속", companion: "여정의 동료" };
const PAGE_META = {
  continent: { label: "대륙 소개", index: "01" },

  guardians: { label: "십방위룡", index: "03", group: "guardian", title: "십방위의 용", sub: "삼주룡 아래에서 십방의 자연현상과 경계를 관리하는 신격.", en: "THE TEN DIRECTIONAL DRAGONS", numeral: "X" },
  retainers: { label: "용신의 권속", index: "04", group: "retainer", title: "용신의 권속들", sub: "각 용신 곁에서 기록·행정·군사·장례·연금·계약·신탁 등 실무를 맡는 13명의 보좌관들.", en: "THE DIVINE RETAINERS", numeral: "XIII" },
  companions: { label: "동료 고행자", index: "05", group: "companion", title: "동료 고행자들", sub: "주인공과 함께 만다라바르샤를 횡단하는 네 명의 여행 동료.", en: "THE JOURNEY COMPANIONS", numeral: "IV" },
  settings: { label: "주요 설정", index: "06" }
};
const ROUTES = Object.keys(PAGE_META);
const ICONS = {
  expand: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></svg>',
  play: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>',
  pause: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>'
};
function esc(str = "") { return String(str).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[c])); }
const pad = n => String(n).padStart(2, "0");
const reducedMotion = () => window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const smoothBehavior = () => reducedMotion() ? "auto" : "smooth";
function hueFor(c) {
  if (c.colors.includes("보라") || c.colors.includes("자주")) return 266;
  if (c.colors.includes("에메랄드") || c.colors.includes("민트") || c.colors.includes("청록")) return 172;
  if (c.colors.includes("진홍") || c.colors.includes("암적색")) return 12;
  if (c.colors.startsWith("백") || c.colors.startsWith("청색")) return c.colors.startsWith("청색") ? 212 : 38;
  return 223;
}
function sectionHeading(number, title, count, unit, sub = "") {
  return `<div class="section-head"><div><div class="section-heading"><span class="section-number" aria-hidden="true">${number}</span><h2>${title}</h2></div>${sub ? `<p>${sub}</p>` : ""}</div><span class="count-label"><b>${pad(count)}</b> ${unit}</span></div>`;
}
function renderNavigation() {
  document.querySelector("#primaryNav").innerHTML = ROUTES.map(route => {
    const meta = PAGE_META[route];
    const count = route === "continent" ? REGIONS.length : route === "settings" ? MAJOR_SETTINGS.length : CHARACTERS.filter(c => c.group === meta.group).length;
    return `<a class="nav-btn" href="#${route}" data-route="${route}"><span class="nav-number" aria-hidden="true">${meta.index}</span><span>${meta.label}</span><span class="nav-count" aria-label="${count}개 항목">${pad(count)}</span></a>`;
  }).join("");
}
function portraitHTML(c) {
  const index = pad(CHARACTERS.indexOf(c) + 1);
  return `<button type="button" class="portrait" data-portrait data-character-id="${esc(c.id)}" aria-label="${esc(c.name)} 상세 보기" aria-haspopup="dialog" style="--hue:${hueFor(c)}">
    <span class="portrait-fallback" aria-hidden="true"><span class="portrait-code">${index} / ${esc(c.roman.toUpperCase())}</span><span class="portrait-initial">${esc(c.roman[0])}</span><span class="portrait-name">${esc(c.title)}</span></span>

function characterCard(c) {

}
function renderCharacterPage(route) {

function mapMarkup() {
  // 방위 관계를 표시하는 개념도입니다. 실제 지형이나 국가 크기를 나타내지 않습니다.
  const nodes = [
    ["maruvana", 23, 29, "북서"], ["ratnagar", 50, 17, "북"], ["akashavia", 77, 29, "북동"],
    ["samudria", 15, 50, "서"], ["vajrakar", 85, 50, "동"],
    ["visharat", 23, 71, "남서"], ["dandrava", 50, 83, "남"], ["jvalagni", 77, 71, "남동"],
    ["suryatra", 50, 5, "천정"], ["patalgar", 50, 95, "지저"]
  ];
  return `<div class="mandala-panel"><div class="map-head"><span>십방의 질서</span><span>MANDALA</span></div><div class="mandala-map" role="group" aria-label="만다라바르샤 방위 개념도">
    <svg class="map-lines" viewBox="0 0 600 600" preserveAspectRatio="none" fill="none" stroke="currentColor" aria-hidden="true"><circle cx="300" cy="300" r="100"/><circle cx="300" cy="300" r="174"/><circle cx="300" cy="300" r="224" stroke-dasharray="2 7"/><path d="M300 42V558M90 300H510M162 150L438 450M438 150L162 450" stroke-dasharray="3 5"/><path d="M300 96L504 300L300 504L96 300Z" stroke-opacity=".6"/><circle cx="300" cy="300" r="181" stroke-opacity=".35"/></svg>
    ${nodes.map(([id, x, y, label]) => `<button type="button" class="map-node${y === 5 || y === 95 ? " polar" : ""}" data-region="${id}" aria-controls="region-${id}" aria-label="${label} ${REGIONS.find(r => r.id === id).name} 기록 열기" style="--x:${x}%;--y:${y}%"><span>${label}</span>${REGIONS.find(r => r.id === id).name}</button>`).join("")}
    <div class="map-core"><span class="map-core-title">삼주신성권</span>${REGIONS.slice(0, 3).map(r => `<button type="button" data-region="${r.id}" aria-controls="region-${r.id}">${r.name}</button>`).join("")}</div>
    </div><div class="map-foot">방위 개념도 · 국가를 선택하면 해당 기록이 열립니다.</div></div>`;
}
function renderContinent() {
  document.querySelector("#page-continent").innerHTML = `<header class="hero continent-hero"><div class="hero-art" aria-hidden="true"></div><div class="hero-content"><div class="eyebrow">WORLD &amp; CONTINENT</div><div class="world-label">${WORLD.worldName}의 중심 대륙</div><h1 tabindex="-1">${WORLD.continentName}</h1><div class="hero-roman" lang="en">${WORLD.continentRoman.toUpperCase()}</div><p>${WORLD.intro}</p></div><div class="hero-bottom"><dl class="hero-stats"><div class="hero-stat"><dt>삼주신성국</dt><dd>${pad(REGIONS.filter(r => r.group === "삼주신성권").length)}</dd></div><div class="hero-stat"><dt>십방의 영역</dt><dd>${pad(REGIONS.filter(r => r.group !== "삼주신성권").length)}</dd></div><div class="hero-stat"><dt>대륙의 국가</dt><dd>${pad(REGIONS.length)}</dd></div></dl><div class="hero-caption">THE WORLD OF AVARTHARA<br>CHAPTER I</div></div></header>
    <section class="section">${sectionHeading("01", "세계의 구조", REGIONS.length, "국가")}<div class="world-grid"><div class="lore-panel"><div class="small-kicker">THE SACRED ORDER</div><h3>하나의 만다라,<br>세계를 잇는 질서.</h3><p>${WORLD.continentIntro}</p><div class="order-list"><div class="order-row"><span>I</span><div><strong>중앙 · 삼주신성권</strong><p>창세·유지·종언을 관장하는 세 신성국.</p></div></div><div class="order-row"><span>II</span><div><strong>둘레 · 여덟 방위국</strong><p>중앙을 둘러싸며 자연현상과 경계를 다스리는 영역.</p></div></div><div class="order-row"><span>III</span><div><strong>천정과 지저</strong><p>상공의 수리야트라와 대륙 아래의 파탈가르.</p></div></div></div></div>${mapMarkup()}</div></section>
    <section class="section" id="regionRecords">${sectionHeading("02", "구역과 주요 장소", REGIONS.length, "기록", "국가별 설명과 관장 용신, 주요 장소를 살펴보세요.")}<div class="region-grid">${REGIONS.map((r, i) => `<details class="region" id="region-${r.id}"><summary class="region-summary"><span class="region-index" aria-hidden="true">${pad(i + 1)}</span><div><strong>${esc(r.name)}</strong><small>${esc(r.group)} · ${esc(r.subtitle)}</small></div><span class="chev" aria-hidden="true">+</span></summary><div class="region-body"><p>${esc(r.desc)}</p><p class="region-ruler"><b>관장 용신</b>${esc(r.ruler)}</p><div class="place-list">${r.places.map(p => `<div class="place"><strong>${esc(p[0])}</strong><span>${esc(p[1])}</span></div>`).join("")}</div></div></details>`).join("")}</div></section>`;
}
function renderSettings() {
  document.querySelector("#page-settings").innerHTML = `<header class="hero chapter-hero"><div><div class="eyebrow">CORE LORE / WORLD RULES</div><h1 tabindex="-1">주요 설정</h1><p>용신·아스트라·고행·고행자.<br>아바르타라 세계를 이루는 네 가지 핵심 개념.</p></div><span class="chapter-numeral" aria-hidden="true">IV</span></header><section class="section character-section">${sectionHeading("06", "세계관 핵심 개념", MAJOR_SETTINGS.length, "개념")}<div class="setting-grid">${MAJOR_SETTINGS.map(s => `<article class="setting-card" id="setting-${s.id}"><div class="setting-top"><span class="setting-index">${s.index}</span><span class="setting-en" lang="en">${s.en}</span></div><h3>${s.title}</h3><p>${s.summary}</p><div class="setting-points">${s.points.map(x => `<span>${esc(x)}</span>`).join("")}</div><div class="setting-note">${s.note}</div></article>`).join("")}</div></section>`;
}
function attachImageFallbacks() {
  document.querySelectorAll("[data-portrait]").forEach(box => {
    const img = box.querySelector("img");
    const ok = () => { img.hidden = false; box.classList.add("has-image"); };
    const fail = () => { box.classList.remove("has-image"); img.hidden = true; };
    img.addEventListener("load", ok);
    img.addEventListener("error", fail);
    if (img.complete) img.naturalWidth ? ok() : fail();
  });
  // 기존 대륙 이미지가 있으면 내장된 분위기 이미지보다 우선합니다.
  const worldArt = new Image();
  worldArt.onload = () => { document.querySelector(".hero-art").style.backgroundImage = `url(${JSON.stringify(WORLD.heroImage)})`; };
  worldArt.src = WORLD.heroImage;
}
function attachRegionMap() {
  document.querySelectorAll("[data-region]").forEach(button => button.addEventListener("click", () => {
    const region = document.getElementById("region-" + button.dataset.region);
    if (!region) return;
    region.open = true;
    document.querySelectorAll("[data-region]").forEach(node => node.classList.toggle("is-selected", node === button));
    region.querySelector("summary").focus({ preventScroll: true });
    region.scrollIntoView({ behavior: smoothBehavior(), block: "center" });
  }));
}
function currentRoute() {
  const raw = location.hash.replace(/^#/, "").split("/")[0];
  return ROUTES.includes(raw) ? raw : "continent";
}
function showRoute(route, pushHash = true, shouldScroll = true, focusHeading = false) {
  if (!ROUTES.includes(route)) route = "continent";
  document.querySelectorAll(".page").forEach(p => {
    const active = p.id === "page-" + route;
    p.classList.toggle("is-active", active);
    p.hidden = !active;
  });
  document.querySelectorAll(".nav-btn").forEach(btn => {
    if (btn.dataset.route === route) btn.setAttribute("aria-current", "page");
    else btn.removeAttribute("aria-current");
  });
  document.querySelector("#currentPage").textContent = PAGE_META[route].label;
  document.title = PAGE_META[route].label + " · 아바르타라 세계관 아카이브";
  if (pushHash && location.hash !== "#" + route) {
    try { history.pushState(null, "", "#" + route); }
    catch (_) { location.hash = route; }
  }
  if (shouldScroll) window.scrollTo({ top: 0, behavior: smoothBehavior() });
  if (focusHeading) document.querySelector("#page-" + route + " h1").focus({ preventScroll: true });
}
function attachRouting() {
  document.querySelectorAll("[data-route]").forEach(link => link.addEventListener("click", event => {
    if (event.ctrlKey || event.metaKey || event.shiftKey || event.altKey || event.button) return;
    event.preventDefault();
    showRoute(link.dataset.route, true, true, event.detail === 0);
  }));
  window.addEventListener("hashchange", () => showRoute(currentRoute(), false));
  window.addEventListener("popstate", () => showRoute(currentRoute(), false));
}
const characterModal = document.querySelector("#characterModal");
const modalImage = document.querySelector("#modalImage");
const modalImageFallback = document.querySelector("#modalImageFallback");
let previousModalFocus = null;
function openCharacterModal(id) {
  const c = CHARACTERS.find(x => x.id === id);
  if (!c) return;
  previousModalFocus = document.activeElement;
  const text = (id, value) => { document.getElementById(id).textContent = value; };
  text("modalKicker", GROUP_LABELS[c.group] + (c.direction ? " / " + c.direction : ""));
  text("modalTitle", c.title + " " + c.name);
  text("modalRoman", c.roman);
  text("modalEpithet", "「" + c.epithet + "」");
  document.querySelector("#modalTags").innerHTML = c.domain.map(x => `<span>${esc(x)}</span>`).join("");
  document.querySelector("#modalGenderLabel").hidden = !c.gender;
  document.querySelector("#modalGender").hidden = !c.gender;
  text("modalGender", c.gender || "");
  text("modalAffiliationLabel", c.group === "trimurti" || c.group === "guardian" ? "담당 국가" : "소속");
  text("modalCountry", c.country);
  text("modalColors", c.colors);
  text("modalPersonality", c.personality);
  text("modalAppearance", c.appearance);
  text("modalLore", c.lore);
  modalImage.hidden = true;
  modalImageFallback.hidden = false;
  modalImageFallback.style.setProperty("--hue", hueFor(c));
  modalImageFallback.innerHTML = `<span class="modal-monogram" aria-hidden="true">${esc(c.roman[0])}</span><strong>${esc(c.name)}</strong><small>인물 일러스트 미등록</small>`;
  modalImage.onload = () => { modalImage.hidden = false; modalImageFallback.hidden = true; };
  modalImage.onerror = () => { modalImage.hidden = true; modalImageFallback.hidden = false; };
  modalImage.alt = c.name + " 프로필 확대";
  modalImage.src = c.image;
  if (!characterModal.open) characterModal.showModal();
  characterModal.scrollTop = 0;
  document.body.classList.add("modal-open");
}
function attachPortraitModals() {
  document.querySelectorAll("[data-portrait]").forEach(button => button.addEventListener("click", () => openCharacterModal(button.dataset.characterId)));
  document.querySelector("#modalClose").addEventListener("click", () => characterModal.close());
  characterModal.addEventListener("click", event => {
    if (event.target !== characterModal) return;
    const box = characterModal.getBoundingClientRect();
    if (event.clientX < box.left || event.clientX > box.right || event.clientY < box.top || event.clientY > box.bottom) characterModal.close();
  });
  characterModal.addEventListener("close", () => {
    document.body.classList.remove("modal-open");
    if (previousModalFocus && previousModalFocus.isConnected) previousModalFocus.focus({ preventScroll: true });
  });
}
const bgmAudio = document.querySelector("#bgmAudio"), bgmToggle = document.querySelector("#bgmToggle"), bgmVolume = document.querySelector("#bgmVolume");
let audioMessageTimer;
function audioMessage(message) {
  const status = document.querySelector("#audioStatus");
  clearTimeout(audioMessageTimer);
  status.textContent = message;
  status.hidden = false;
  audioMessageTimer = setTimeout(() => { status.hidden = true; }, 5000);
}
function syncBgm() {
  const playing = !bgmAudio.paused && !bgmAudio.ended;
  bgmToggle.innerHTML = playing ? ICONS.pause : ICONS.play;
  bgmToggle.setAttribute("aria-label", playing ? "BGM 일시정지" : "BGM 재생");
  document.querySelector("#bgmLabel").textContent = playing ? "재생 중" : "배경 음악";
}
function setupBgm() {
  // 로컬 파일 모드·개인정보 보호 설정에서도 나머지 UI가 정상 작동합니다.
  try {
    const saved = localStorage.getItem("avarthara-bgm-volume");
    if (saved !== null && Number.isFinite(Number(saved))) bgmVolume.value = String(Math.max(0, Math.min(1, Number(saved))));
  } catch (_) {}
  bgmAudio.volume = Number(bgmVolume.value);
  bgmToggle.addEventListener("click", async () => {
    if (!bgmAudio.paused) { bgmAudio.pause(); return; }
    bgmToggle.disabled = true;
    try { await bgmAudio.play(); }
    catch (_) { audioMessage("음악을 불러오지 못했습니다. 음원 파일을 확인해 주세요."); }
    finally { bgmToggle.disabled = false; syncBgm(); }
  });
  bgmVolume.addEventListener("input", () => {
    bgmAudio.volume = Number(bgmVolume.value);
    try { localStorage.setItem("avarthara-bgm-volume", bgmVolume.value); } catch (_) {}
  });
  bgmAudio.addEventListener("play", syncBgm);
  bgmAudio.addEventListener("pause", syncBgm);
  bgmAudio.addEventListener("ended", syncBgm);
  bgmAudio.addEventListener("error", () => { bgmToggle.disabled = false; syncBgm(); });
  syncBgm();
}
renderNavigation();
renderContinent();
["trimurti", "guardians", "retainers", "companions"].forEach(renderCharacterPage);
renderSettings();
attachImageFallbacks();
attachRegionMap();
attachRouting();
attachPortraitModals();
showRoute(currentRoute(), false, false);
setupBgm();

</script>
